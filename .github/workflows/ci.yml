name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  client-quality:
    name: Client quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - name: Upload client coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: client-coverage
          path: client/coverage
          if-no-files-found: error

  server-quality:
    name: Server quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: breastfeeding_test
          POSTGRES_USER: breastfeeding
          POSTGRES_PASSWORD: breastfeeding
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U breastfeeding -d breastfeeding_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      FLASK_ENV: testing
      DATABASE_URL: postgresql+psycopg://breastfeeding:breastfeeding@localhost:5432/breastfeeding_test
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/requirements-dev.lock
      - run: python -m pip install --requirement requirements-dev.lock
      - run: python -m pip install --no-build-isolation --no-deps --editable .
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m mypy app
      - run: python -m flask --app wsgi db upgrade
      - run: python -m pytest --cov=app --cov-report=term-missing --cov-report=xml
      - run: openapi-spec-validator ../docs/openapi.yaml
      - name: Test deployment tooling
        working-directory: .
        run: python -m unittest discover -s scripts/deploy/tests -v
      - name: Upload server coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-coverage
          path: server/coverage.xml
          if-no-files-found: error

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/requirements-dev.lock
      - run: npm ci
        working-directory: client
      - run: npm audit --audit-level=high
        working-directory: client
      - run: python -m pip install --requirement server/requirements-dev.lock
      - run: python -m pip_audit --requirement server/requirements-dev.lock
