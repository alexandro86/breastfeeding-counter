name: Deploy staging
run-name: Deploy staging ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy immutable commit to staging
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      vars.STAGING_DEPLOYMENT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: staging
      url: ${{ steps.vercel-deploy.outputs.url }}
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_STAGING_ALIAS: ${{ vars.VERCEL_STAGING_ALIAS }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$API_BASE_URL" =~ ^https://[^/[:space:]]+(/api/v1)?/?$ ]]
          [[ "$FRONTEND_URL" =~ ^https://[^/[:space:]]+/?$ ]]
          [[ "$RENDER_SERVICE_ID" =~ ^srv-[A-Za-z0-9]+$ ]]
          [[ "$VERCEL_STAGING_ALIAS" =~ ^[A-Za-z0-9.-]+$ ]]
          test -n "$RENDER_API_KEY"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          test -n "$VERCEL_TOKEN"

      - name: Checkout validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false

      - name: Deploy API and wait for Render
        run: >-
          python scripts/deploy/render_deploy.py
          --service-id "$RENDER_SERVICE_ID"
          --commit-sha "$DEPLOY_SHA"
          --timeout-seconds 1800

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@58.0.0

      - name: Pull Vercel staging configuration
        working-directory: client
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build frontend for staging
        working-directory: client
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy frontend staging candidate
        id: vercel-deploy
        working-directory: client
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$(
            vercel deploy --prebuilt --token="$VERCEL_TOKEN" \
              --meta "gitCommitSha=$DEPLOY_SHA"
          )"
          [[ "$deployment_url" =~ ^https://[A-Za-z0-9.-]+/?$ ]]
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Smoke test staging candidate
        run: >-
          python scripts/deploy/smoke_test.py
          --api-base-url "$API_BASE_URL"
          --frontend-url "${{ steps.vercel-deploy.outputs.url }}"
          --expected-commit "$DEPLOY_SHA"
          --attempts 12
          --interval-seconds 15

      - name: Promote staging candidate to stable alias
        working-directory: client
        run: >-
          vercel alias set
          "${{ steps.vercel-deploy.outputs.url }}"
          "$VERCEL_STAGING_ALIAS"
          --token="$VERCEL_TOKEN"

      - name: Smoke test stable staging URLs
        run: >-
          python scripts/deploy/smoke_test.py
          --api-base-url "$API_BASE_URL"
          --frontend-url "$FRONTEND_URL"
          --expected-commit "$DEPLOY_SHA"
          --attempts 12
          --interval-seconds 15
