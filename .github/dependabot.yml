version: 2
updates:
  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    groups:
      client-minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: pip
    directory: /server
    schedule:
      interval: weekly
    groups:
      server-minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
