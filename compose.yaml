name: breastfeeding-counter

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: breastfeeding
      POSTGRES_USER: breastfeeding
      POSTGRES_PASSWORD: breastfeeding
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U breastfeeding -d breastfeeding"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
